# ./config/traefik.yml

# Global Configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# Log level
log:
  level: DEBUG

# API and dashboard: disabled. The dashboard router had no authentication,
# so the whole routing config was public. Use an SSH tunnel if needed.

# Define entrypoints for web (HTTP) and websecure (HTTPS)
entryPoints:
  web:
    address: ":80"
    # Global redirect from HTTP to HTTPS
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      middlewares:
        - strip-identity-headers@file
        - edge-security-headers@file

# Configure providers
providers:
  docker:
    exposedByDefault: false
    network: hindsight-ai
  file:
    directory: /config
    watch: true

# Configure Let's Encrypt certificate resolver using Cloudflare DNS challenge
certificatesResolvers:
  letsencrypt:
    acme:
      email: <email_placeholder>
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: cloudflare
